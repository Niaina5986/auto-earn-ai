name: AUTO-EARN AI ULTRA

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: auto-earn-ai-ultra
  cancel-in-progress: false

jobs:
  run-agent:
    name: Run AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check project files
        run: |
          python --version
          test -f agent.py
          test -f research_agent.py
          test -f analysis_agent.py
          test -f product_engine.py
          echo "Project files verified."

      - name: Run AUTO-EARN AI ULTRA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PUBLIC_JOB_FEEDS: "1"
          ENABLE_GITHUB_SEARCH: "1"
          ENABLE_CRYPTO_MARKET_DATA: "1"
          ENABLE_EXECUTION: "1"
          LIVE_TRADING: "0"
          AUTO_SUBMIT: "0"
          AUTO_PUBLISH: "0"
          MAX_ITEMS_PER_SOURCE: "1000"
          REQUEST_TIMEOUT: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          python agent.py

      - name: Run automated tests
        if: success()
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory found."
          fi

      - name: Upload reports, products and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-earn-ai-ultra-${{ github.run_number }}
          path: |
            reports/
            products/
            data/
            workspace/
          if-no-files-found: warn
          retention-days: 30
