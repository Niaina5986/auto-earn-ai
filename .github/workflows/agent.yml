name: AUTO-EARN AI ULTRA

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: auto-earn-ai-ultra
  cancel-in-progress: false

jobs:
  run-agent:
    name: Run AUTO-EARN AI ULTRA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Verify entry file
        run: |
          if [ ! -f agent.py ]; then
            echo "ERROR: agent.py is missing"
            exit 1
          fi
          echo "Entry file found."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run AUTO-EARN AI ULTRA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PUBLIC_JOB_FEEDS: "1"
          ENABLE_GITHUB_SEARCH: "1"
          ENABLE_CRYPTO_MARKET_DATA: "1"
          ENABLE_EXECUTION: "1"
          LIVE_TRADING: "0"
          AUTO_SUBMIT: "0"
          AUTO_PUBLISH: "0"
          MAX_ITEMS_PER_SOURCE: "1000"
          REQUEST_TIMEOUT: "20"
          PYTHONUNBUFFERED: "1"
        run: python agent.py

      - name: Run tests
        if: success()
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory."
          fi

      - name: Save reports and products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-earn-ai-ultra-${{ github.run_number }}
          path: |
            reports/
            products/
            data/
            workspace/
          if-no-files-found: warn
          retention-days: 30
