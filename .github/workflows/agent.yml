name: AUTO-EARN AI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

concurrency:
  group: auto-earn-ai
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer AUTO-EARN AI
        run: python agent.py

      - name: Publier les rapports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report.json report.md

          if ! git diff --cached --quiet; then
            git commit -m "Update AUTO-EARN AI reports"
            git push
          else
            echo "Aucun changement dans les rapports."
          fi

      - name: Sauvegarder les rapports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-auto-earn-ai
          path: |
            report.json
            report.md
          if-no-files-found: warn
          retention-days: 14
